<script>
/* ===== Configuration Supabase =====
   La clé « publiable » (sb_publishable_...) peut être publique : la sécurité vient des policies RLS.
   N'utilisez JAMAIS la clé secrète / service_role dans ce fichier. */
const SUPABASE_URL = 'https://fhvhygtrwalnbmplhvqv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_rVaeSfhXt4uvyhBzEF9psA_FOiBZ_jF';
const RECOVERY_URL = /type=recovery/.test(location.hash), LINK_ERR = /error_code=|error_description=/.test(location.hash);
const CONFIG_OK = !SUPABASE_KEY.startsWith('COLLE');
const sb = CONFIG_OK ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

/* ===== Outils ===== */
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const msg = (el, t, ok) => { el.innerHTML = `<p class="msg ${ok ? 'ok' : 'ko'}" role="status">${esc(t)}</p>`; };
const go = h => { location.hash = h; };
const ERR = { 'Invalid login credentials': 'E-mail ou mot de passe incorrect.', 'Email not confirmed': 'Confirmez d’abord votre e-mail (lien reçu par courriel).', 'User already registered': 'Un compte existe déjà avec cet e-mail.', 'New password should be different from the old password.': 'Choisissez un mot de passe différent de l’ancien.', 'Auth session missing!': 'Session expirée : redemandez un lien de réinitialisation.' };
const tr = m => ERR[m] || m;
const STAT = { en_attente: ['En attente de validation', '#b8892f'], valide: ['Validé', '#2e7d4f'], refuse: ['Refusé', '#c0392b'] };
const tag = s => `<span class="tag" style="background:${(STAT[s] || STAT.en_attente)[1]}">${(STAT[s] || STAT.en_attente)[0]}</span>`;
const SECT = ['Tabou', 'Grand-Béréby', 'San-Pédro', 'Sassandra', 'Fresco', 'Grand-Lahou', 'Jacqueville', 'Abidjan', 'Grand-Bassam', 'Bonoua', 'Assinie', 'Adiaké'];
let user = null, prof = null, isAdm = false, recovery = RECOVERY_URL, linkErrShown = false;

/* ===== Session ===== */
async function load() {
  if (!sb) { nav(); route(); return; }
  const { data: { session } } = await sb.auth.getSession();
  user = session?.user ?? null; prof = null; isAdm = false;
  if (user) {
    prof = (await sb.from('profiles').select('*').eq('id', user.id).maybeSingle()).data;
    isAdm = (await sb.rpc('is_admin')).data === true;
  }
  nav(); route();
}
function nav() {
  const L = [['accueil', 'Accueil']];
  if (!user) L.push(['connexion', 'Connexion'], ['inscription', 'Créer un compte']);
  else { L.push(['compte', 'Mon compte']); if (isAdm) L.push(['admin', 'Administration']); }
  const cur = location.hash.slice(1) || 'accueil';
  $('#nav').innerHTML = L.map(([h, t]) => `<a href="#${h}"${cur === h ? ' class="on"' : ''}>${t}</a>`).join('') + (user ? '<button id="out" class="btn ghost" type="button">Déconnexion</button>' : '');
  $('#out')?.addEventListener('click', async () => { await sb.auth.signOut(); go('#accueil'); });
}

/* ===== Pages ===== */
const alerteConfig = () => CONFIG_OK ? '' : '<p class="msg ko">Configuration : collez votre clé publiable Supabase dans la constante SUPABASE_KEY de index.html.</p>';

function accueil() {
  app.innerHTML = `<div class="hero"><h1>Chaque mètre de côte perdu mérite d’être mesuré.</h1><p>EroTrack réunit chercheurs, étudiants et citoyens pour suivre le recul du trait de côte en Côte d’Ivoire.</p>${user ? '<a class="btn gold" href="#compte">Mon compte</a>' : '<a class="btn gold" href="#inscription">Créer un compte</a> <a class="btn ghost" href="#connexion">Se connecter</a>'}</div>${alerteConfig()}<section><h2>Douze secteurs, un même littoral</h2><div class="grid">${SECT.map(s => `<div class="card"><h3>${s}</h3></div>`).join('')}</div></section>`;
}

function connexion() {
  if (user) return go('#compte');
  app.innerHTML = `<section><h1>Connexion</h1>${alerteConfig()}<form class="card" id="f"><label for="e">E-mail</label><input id="e" type="email" autocomplete="email" required><label for="p">Mot de passe</label><input id="p" type="password" autocomplete="current-password" required><p style="margin:6px 0 0"><a href="#mot-de-passe-oublie">Mot de passe oublié ?</a></p><p><button class="btn" type="submit">Se connecter</button></p><div id="m"></div><p class="note">Pas encore de compte ? <a href="#inscription">Créer un compte</a></p></form></section>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); if (!sb) return;
    const { error } = await sb.auth.signInWithPassword({ email: $('#e').value.trim(), password: $('#p').value });
    if (error) return msg($('#m'), tr(error.message));
    go('#compte');
  };
}

function inscription() {
  if (user) return go('#compte');
  app.innerHTML = `<section><h1>Créer un compte</h1>${alerteConfig()}<form class="card" id="f"><label for="n">Nom et prénom (ou pseudonyme)</label><input id="n" maxlength="100" required><label for="e">E-mail</label><input id="e" type="email" autocomplete="email" required><label for="p">Mot de passe (8 caractères minimum)</label><input id="p" type="password" minlength="8" autocomplete="new-password" required><label for="t">Type de compte demandé</label><select id="t"><option value="utilisateur">Utilisateur (étudiant, élu, citoyen, pêcheur)</option><option value="chercheur">Chercheur</option></select><label for="i">Institution (facultatif)</label><input id="i" maxlength="150"><label class="chk"><input id="c" type="checkbox" required><span>Je comprends que mon inscription sera examinée par un administrateur avant d’être validée.</span></label><p><button class="btn" type="submit">Créer mon compte</button></p><div id="m"></div><p class="note">Déjà inscrit ? <a href="#connexion">Se connecter</a></p></form></section>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); if (!sb) return;
    const { data, error } = await sb.auth.signUp({
      email: $('#e').value.trim(), password: $('#p').value,
      options: { data: { nom: $('#n').value.trim(), type_compte: $('#t').value, institution: $('#i').value.trim() }, emailRedirectTo: location.origin + location.pathname }
    });
    if (error) return msg($('#m'), tr(error.message));
    $('#f').querySelector('button').disabled = true;
    if (data.session) { msg($('#m'), 'Compte créé. Votre inscription est en attente de validation par un administrateur.', true); setTimeout(() => go('#compte'), 1200); }
    else msg($('#m'), 'Compte créé : confirmez votre adresse via le lien reçu par e-mail, puis connectez-vous. Votre inscription sera ensuite examinée par un administrateur.', true);
  };
}

function compte() {
  if (!user) return go('#connexion');
  if (!prof) { app.innerHTML = '<section><h1>Mon compte</h1><p>Votre profil est en cours de création. Rechargez la page dans un instant.</p></section>'; return; }
  const ok = prof.statut === 'valide';
  app.innerHTML = `<section><h1>Mon compte</h1><p>${tag(prof.statut)} <span class="note">Compte ${esc(prof.type_compte)}</span></p>${ok ? '<div class="card"><h3>Accès membre activé</h3><p>Votre inscription a été validée. Les fonctions réservées aux membres s’afficheront ici.</p></div>' : prof.statut === 'refuse' ? '<p class="msg ko">Votre inscription a été refusée. Contactez l’équipe d’EroTrack pour en savoir plus.</p>' : '<p class="msg ok" style="background:#fbf0d5;color:#5a4410">Votre inscription est en attente de validation par un administrateur.</p>'}<h2 style="margin-top:28px">Mes informations</h2><form class="card" id="f"><label>E-mail</label><input value="${esc(prof.email)}" disabled><label for="n">Nom</label><input id="n" maxlength="100" value="${esc(prof.nom)}" required><label for="i">Institution</label><input id="i" maxlength="150" value="${esc(prof.institution)}"><p><button class="btn" type="submit">Enregistrer</button></p><div id="m"></div></form></section>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('profiles').update({ nom: $('#n').value.trim(), institution: $('#i').value.trim() || null }).eq('id', user.id);
    if (error) return msg($('#m'), error.message);
    prof.nom = $('#n').value.trim(); msg($('#m'), 'Informations enregistrées.', true);
  };
}

async function admin() {
  if (!user) return go('#connexion');
  if (!isAdm) { app.innerHTML = '<section><h1>Administration</h1><p>Cet espace est réservé aux administrateurs.</p></section>'; return; }
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) { app.innerHTML = `<section><h1>Administration</h1><p class="msg ko">${esc(error.message)}</p></section>`; return; }
  const P = (data ?? []).sort((a, b) => (a.statut === 'en_attente' ? 0 : 1) - (b.statut === 'en_attente' ? 0 : 1));
  const att = P.filter(p => p.statut === 'en_attente').length;
  app.innerHTML = `<section><h1>Administration</h1><p>${att} inscription(s) en attente sur ${P.length}.</p><div class="card">${P.map(p => `<div class="row"><div><b>${esc(p.nom)}</b> ${tag(p.statut)}<br><span class="note">${esc(p.email)} · ${esc(p.type_compte)}${p.institution ? ' · ' + esc(p.institution) : ''} · ${new Date(p.created_at).toLocaleDateString('fr-FR')}</span></div><div>${p.statut !== 'valide' ? `<button class="btn sm" data-id="${esc(p.id)}" data-s="valide">Valider</button> ` : ''}${p.statut !== 'refuse' ? `<button class="btn sm red" data-id="${esc(p.id)}" data-s="refuse">Refuser</button>` : ''}</div></div>`).join('') || '<p>Aucune inscription.</p>'}</div></section>`;
  app.querySelectorAll('[data-id]').forEach(b => b.onclick = async () => {
    const { error } = await sb.rpc('valider_profil', { p_id: b.dataset.id, p_statut: b.dataset.s });
    error ? alert(error.message) : admin();
  });
}

function oublie() {
  if (user && !recovery) return go('#compte');
  app.innerHTML = `<section><h1>Mot de passe oublié</h1>${alerteConfig()}${LINK_ERR ? '<p class="msg ko">Ce lien a expiré ou a déjà été utilisé. Demandez-en un nouveau ci-dessous.</p>' : ''}<form class="card" id="f"><p>Saisissez l’adresse e-mail de votre compte : nous vous enverrons un lien pour choisir un nouveau mot de passe.</p><label for="e">E-mail</label><input id="e" type="email" autocomplete="email" required><p><button class="btn" type="submit">Envoyer le lien</button></p><div id="m"></div><p class="note"><a href="#connexion">← Retour à la connexion</a></p></form></section>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); if (!sb) return;
    const b = $('#f').querySelector('button'); b.disabled = true;
    const { error } = await sb.auth.resetPasswordForEmail($('#e').value.trim(), { redirectTo: location.origin + location.pathname });
    if (error) {
      if (/rate|seconds|too many/i.test(error.message)) { msg($('#m'), 'Trop de demandes : patientez une minute avant de redemander un lien.'); setTimeout(() => b.disabled = false, 60000); }
      else { b.disabled = false; msg($('#m'), tr(error.message)); }
      return;
    }
    msg($('#m'), 'Si un compte existe avec cette adresse, un lien de réinitialisation vient d’être envoyé. Pensez à vérifier vos courriers indésirables.', true);
    setTimeout(() => b.disabled = false, 60000);
  };
}

function reinitialiser() {
  if (!recovery) return go('#mot-de-passe-oublie');
  app.innerHTML = `<section><h1>Nouveau mot de passe</h1><form class="card" id="f"><label for="p1">Nouveau mot de passe (8 caractères minimum)</label><input id="p1" type="password" minlength="8" autocomplete="new-password" required><label for="p2">Confirmer le mot de passe</label><input id="p2" type="password" minlength="8" autocomplete="new-password" required><p><button class="btn" type="submit">Enregistrer le mot de passe</button></p><div id="m"></div></form></section>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    if ($('#p1').value !== $('#p2').value) return msg($('#m'), 'Les deux mots de passe ne correspondent pas.');
    recovery = false;
    const { error } = await sb.auth.updateUser({ password: $('#p1').value });
    if (error) { recovery = true; return msg($('#m'), tr(error.message)); }
    msg($('#m'), 'Mot de passe modifié. Vous êtes connecté(e).', true);
    setTimeout(async () => { await load(); go('#compte'); }, 1200);
  };
}

const PAGES = { accueil, connexion, inscription, compte, admin, 'mot-de-passe-oublie': oublie, reinitialiser };
async function route() {
  if (recovery && location.hash.slice(1) !== 'reinitialiser') return go('#reinitialiser');
  if (LINK_ERR && !linkErrShown) { linkErrShown = true; return go('#mot-de-passe-oublie'); }
  nav();
  await (PAGES[location.hash.slice(1)] ?? accueil)();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
if (sb) sb.auth.onAuthStateChange(ev => {
  if (ev === 'PASSWORD_RECOVERY') { recovery = true; setTimeout(() => { load(); go('#reinitialiser'); }, 0); return; }
  if (ev !== 'INITIAL_SESSION') setTimeout(load, 0);
});
load();
</script></body></html>
